apiVersion: apps/v1
kind: Deployment
metadata:
  name: kw
  namespace: kw
  labels:
    app: kw
    app.kubernetes.io/name: kw
    app.kubernetes.io/part-of: kw-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kw
  template:
    metadata:
      labels:
        app: kw
    spec:
      containers:
      - name: kw
        image: ghcr.io/thiemotorres/kw:latest
        # 'latest' tag => pull on every (re)start so new pushes are picked up
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
